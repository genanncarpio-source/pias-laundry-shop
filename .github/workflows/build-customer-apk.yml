name: Build Pia's Laundry Shop APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Flutter packages
        working-directory: mobile_app/native
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile_app/native
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pias-laundry-shop-customer-apk
          path: mobile_app/native/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

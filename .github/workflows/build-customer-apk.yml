name: Build Pia's Laundry Shop APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Flutter packages
        working-directory: mobile_app/native
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile_app/native
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pias-laundry-shop-customer-apk
          path: mobile_app/native/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  web-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Flutter web platform
        working-directory: mobile_app/native
        run: flutter create --platforms=web .

      - name: Restore Flutter packages
        working-directory: mobile_app/native
        run: flutter pub get

      - name: Build web preview
        working-directory: mobile_app/native
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Add one-time cleanup for older Flutter web caches
        working-directory: mobile_app/native
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path("build/web/index.html")
          html = index.read_text(encoding="utf-8")
          cleanup = """<script>
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then((registrations) =>
              Promise.all(registrations.map((registration) => registration.unregister()))
            );
          }
          if ('caches' in window) {
            caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))));
          }
          </script>"""
          if "</head>" not in html:
              raise SystemExit("Could not find </head> in the Flutter web index.html")
          index.write_text(html.replace("</head>", cleanup + "\n</head>", 1), encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web build to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile_app/native/build/web

      - name: Deploy web preview
        id: deployment
        uses: actions/deploy-pages@v4
